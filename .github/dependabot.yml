version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem keeps the review load sane for a small project.
      tanstack:
        patterns: ['@tanstack/*']
      dev-dependencies:
        dependency-type: development
      production:
        dependency-type: production
        exclude-patterns: ['@tanstack/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
