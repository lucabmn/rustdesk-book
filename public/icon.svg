<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>rustdesk-book</title>
  <!--
    Maskable app icon: the same geometry as favicon.svg, scaled 24 -> 512 and
    inset far enough that a circular or squircle mask never clips the frame.
    Fixed colours on purpose — an installed icon does not follow the OS theme.
  -->
  <rect width="512" height="512" rx="112" fill="#1b1e27" />
  <g transform="translate(112 112) scale(12)">
    <path fill="#f2f3f6" d="M6 3h3v18H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" />
    <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="#f2f3f6" stroke-width="2" />
    <circle cx="15" cy="12" r="2.5" fill="#6d9bff" />
  </g>
</svg>
