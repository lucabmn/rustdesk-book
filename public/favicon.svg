<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>rustdesk-book</title>
  <!--
    The mark: a bound volume that is also a screen. The solid spine on the left
    is what keeps it from reading as the ubiquitous "toggle sidebar" icon; the
    dot is the session that is up.

    It carries its own tile rather than adapting via prefers-color-scheme: that
    query follows the browser's scheme, not the tab strip's, so a transparent
    mark disappears against half the chrome it lands on.

    Geometry matches `icon.svg` and <BrandGlyph> in
    src/components/brand-mark.tsx — change one, change all three.
  -->
  <rect width="32" height="32" rx="7" fill="#1b1e27" />
  <g transform="translate(-1.333 -1.333) scale(1.4444)">
    <path fill="#f2f3f6" d="M6 3h3v18H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" />
    <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="#f2f3f6" stroke-width="2" />
    <circle cx="15" cy="12" r="2.5" fill="#6d9bff" />
  </g>
</svg>
