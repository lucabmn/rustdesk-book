name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` may only move forward: it is claimed by a stable tag that is
      # also the newest release reachable from the default branch. A patch cut
      # from an old maintenance branch, or a pre-release, must never take it.
      - name: Decide whether this tag owns `latest`
        id: latest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          owns=false
          if [[ "$tag" != *-* ]] &&
             git merge-base --is-ancestor "$tag" "origin/${{ github.event.repository.default_branch }}" &&
             [[ "$(git tag --list 'v*' --merged "origin/${{ github.event.repository.default_branch }}" \
                    | grep -v -- '-' | sort -V | tail -n1)" == "$tag" ]]; then
            owns=true
          fi
          echo "owns=$owns" >> "$GITHUB_OUTPUT"
          echo "Tag $tag owns latest: $owns"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.owns == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
